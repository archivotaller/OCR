[package]
name = "octxt"
version = "0.2.0"
edition = "2021"
description = "OCR de escritorio basado en PP-OCRv6 (tract / 100% Rust): texto, JSON, PDF buscable y PDF con texto visible reemplazado."
license = "Apache-2.0"
readme = "README.md"

[lib]
name = "octxt"
path = "src/lib.rs"

[[bin]]
name = "octxt"
path = "src/main.rs"

[[bin]]
name = "octxt-gui"
path = "src/bin/octxt-gui/main.rs"

# Herramientas históricas de I+D sobre ONNX/tract. No se compilan por defecto:
# requieren `--features dev-tools` y se usan solo para diagnosticar modelos.
[features]
dev-tools = []

[[example]]
name = "scan"
required-features = ["dev-tools"]

[[example]]
name = "sanitize"
required-features = ["dev-tools"]

[[example]]
name = "rewrite"
required-features = ["dev-tools"]

[[example]]
name = "expr"
required-features = ["dev-tools"]

[[example]]
name = "probe"
required-features = ["dev-tools"]

[[example]]
name = "probe2"
required-features = ["dev-tools"]

[dependencies]
anyhow = "1"
clap = { version = "=4.6.1", features = ["derive"] }
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow"] }
image = "0.25"
imageproc = "0.25"
lopdf = { version = "0.44", default-features = false, features = ["chrono", "rayon", "embed_image"] }
rayon = "1"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiff = "0.11"
tract-data = "0.21.17"
tract-onnx = "0.21.17"
ureq = "2"
ttf-parser = "0.25"
# PDFium embebido en el binario: rasteriza PDFs de entrada y expone metadatos de
# fuente por carácter. La descarga (una sola vez, en el build) se verifica por
# SHA-256; en tiempo de ejecución la DLL se extrae a la caché local.
pdfium-bundled = { version = "0.2", features = ["bundled"] }

[dev-dependencies]
# Para validar los PDF generados en los tests de integración.
lopdf = { version = "0.44", default-features = false, features = ["chrono", "rayon", "embed_image"] }

# `pdfium-bundled` fija PDFium 8066 pero activa `pdfium_latest` (8125) en
# pdfium-render, lo que hace fallar el binding por símbolos ausentes. La copia
# local solo cambia esa feature a `pdfium_7881`; el resto (descarga, SHA-256 y
# biblioteca embebida) es el original.
[patch.crates-io]
pdfium-bundled = { path = "vendor/pdfium-bundled" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
